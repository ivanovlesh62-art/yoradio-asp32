name: Build yoRadio ESP32

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & esptool
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install esptool and pyserial
        run: pip install esptool pyserial

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure and Install ESP32 Core 2.0.17
        env:
          ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: ""
        run: |
          rm -rf ~/.arduino15
          PROTO="https"
          HOST="raw.githubusercontent.com"
          REPO="espressif/arduino-esp32/gh-pages/package_esp32_index.json"
          ESP_URL="${PROTO}://${HOST}/${REPO}"
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls "$ESP_URL"
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls "$ESP_URL"

      - name: Install Required Libraries
        run: |
          rm -f yoRadio/LiquidCrystal_I2C.cpp
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "LiquidCrystal"
          arduino-cli lib install "AsyncTCP"
          arduino-cli lib install "ESP Async WebServer"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "GyverButton"
          arduino-cli lib install "GyverEncoder"
          cat << 'EOF' > yoRadio/src/displays/LiquidCrystal_I2C.cpp
          #include "tools/LiquidCrystal_I2C.h"
          #include <Arduino.h>
          #include <Wire.h>
          LiquidCrystal_I2C::LiquidCrystal_I2C(uint8_t a, uint8_t c, uint8_t r, uint8_t sda, uint8_t scl) { _addr=a; _cols=c; _rows=r; _sda=sda; _scl=scl; _backlightval=LCD_BACKLIGHT; }
          void LiquidCrystal_I2C::init() { Wire.begin(_sda, _scl); _displayfunction = LCD_4BITMODE | LCD_2LINE | LCD_5x8DOTS; delay(50); expanderWrite(_backlightval); delay(100); write4bits(0x30); delayMicroseconds(4500); write4bits(0x30); delayMicroseconds(4500); write4bits(0x30); delayMicroseconds(150); write4bits(0x20); command(LCD_FUNCTIONSET | _displayfunction); _displaycontrol = LCD_DISPLAYON | LCD_CURSOROFF | LCD_BLINKOFF; display(); clear(); _displaymode = LCD_ENTRYLEFT | LCD_ENTRYSHIFTDECREMENT; command(LCD_ENTRYMODESET | _displaymode); home(); }
          void LiquidCrystal_I2C::begin(uint8_t c, uint8_t l, uint8_t d) { init(); }
          void LiquidCrystal_I2C::clear() { command(LCD_CLEARDISPLAY); delayMicroseconds(2000); }
          void LiquidCrystal_I2C::home() { command(LCD_RETURNHOME); delayMicroseconds(2000); }
          void LiquidCrystal_I2C::setCursor(uint8_t col, uint8_t row) { int o[] = {0x00, 0x40, 0x14, 0x54}; if (row >= _rows) row = _rows - 1; command(LCD_SETDDRAMADDR | (col + o[row])); }
          void LiquidCrystal_I2C::noDisplay() { _displaycontrol &= ~LCD_DISPLAYON; command(LCD_DISPLAYCONTROL | _displaycontrol); }
          void LiquidCrystal_I2C::display() { _displaycontrol |= LCD_DISPLAYON; command(LCD_DISPLAYCONTROL | _displaycontrol); }
          void LiquidCrystal_I2C::noCursor() { _displaycontrol &= ~LCD_CURSORON; command(LCD_DISPLAYCONTROL | _displaycontrol); }
          void LiquidCrystal_I2C::cursor() { _displaycontrol |= LCD_CURSORON; command(LCD_DISPLAYCONTROL | _displaycontrol); }
          void LiquidCrystal_I2C::noBlink() { _displaycontrol &= ~LCD_BLINKON; command(LCD_DISPLAYCONTROL | _displaycontrol); }
          void LiquidCrystal_I2C::blink() { _displaycontrol |= LCD_BLINKON; command(LCD_DISPLAYCONTROL | _displaycontrol); }
          void LiquidCrystal_I2C::scrollDisplayLeft() { command(LCD_CURSORSHIFT | LCD_DISPLAYMOVE | LCD_MOVELEFT); }
          void LiquidCrystal_I2C::scrollDisplayRight() { command(LCD_CURSORSHIFT | LCD_DISPLAYMOVE | LCD_MOVERIGHT); }
          void LiquidCrystal_I2C::leftToRight() { _displaymode |= LCD_ENTRYLEFT; command(LCD_ENTRYMODESET | _displaymode); }
          void LiquidCrystal_I2C::rightToLeft() { _displaymode &= ~LCD_ENTRYLEFT; command(LCD_ENTRYMODESET | _displaymode); }
          void LiquidCrystal_I2C::autoscroll() { _displaymode |= LCD_ENTRYSHIFTINCREMENT; command(LCD_ENTRYMODESET | _displaymode); }
          void LiquidCrystal_I2C::noAutoscroll() { _displaymode &= ~LCD_ENTRYSHIFTINCREMENT; command(LCD_ENTRYMODESET | _displaymode); }
          void LiquidCrystal_I2C::createChar(uint8_t l, uint8_t m[]) { l &= 0x7; command(LCD_SETCGRAMADDR | (l << 3)); for (int i = 0; i < 8; i++) write(m[i]); }
          void LiquidCrystal_I2C::noBacklight() { _backlightval = LCD_NOBACKLIGHT; expanderWrite(0); }
          void LiquidCrystal_I2C::backlight() { _backlightval = LCD_BACKLIGHT; expanderWrite(0); }
          void LiquidCrystal_I2C::command(uint8_t v) { send(v, 0); }
          size_t LiquidCrystal_I2C::write(uint8_t v) { send(v, Rs); return 1; }
          void LiquidCrystal_I2C::send(uint8_t v, uint8_t m) { write4bits((v & 0xf0) | m); write4bits(((v << 4) & 0xf0) | m); }
          void LiquidCrystal_I2C::write4bits(uint8_t v) { expanderWrite(v); expanderWrite(v | En); delayMicroseconds(1); expanderWrite(v & ~En); delayMicroseconds(50); }
          void LiquidCrystal_I2C::expanderWrite(uint8_t d) { Wire.beginTransmission(_addr); Wire.write((int)(d) | _backlightval); Wire.endTransmission(); }
          EOF



      - name: Copy custom font
        run: |
          if [ -f "yoRadio/fonts/glcdfont.c" ]; then
            cp -f yoRadio/fonts/glcdfont.c ~/Arduino/libraries/Adafruit_GFX_Library/glcdfont.c
          elif [ -f "fonts/glcdfont.c" ]; then
            cp -f fonts/glcdfont.c ~/Arduino/libraries/Adafruit_GFX_Library/glcdfont.c
          fi

      - name: Compile yoRadio Sketch
        run: |
          SKETCH_DIR="yoRadio"
          [ ! -d "$SKETCH_DIR" ] && SKETCH_DIR="."
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-path ./build_out \
            "$SKETCH_DIR"

      - name: Merge Binaries into Single File
        run: |
          python -m esptool --chip esp32 merge_bin \
            -o yoRadio_merged.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 ./build_out/*.ino.bootloader.bin \
            0x8000 ./build_out/*.ino.partitions.bin \
            0xe000 ~/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin \
            0x10000 ./build_out/*.ino.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yoRadio-ESP32-Firmware
          path: |
            yoRadio_merged.bin
            ./build_out/*.ino.bin
            
