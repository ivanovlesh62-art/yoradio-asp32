name: Build yoRadio ESP32

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python & esptool
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install esptool and pyserial
        run: pip install esptool pyserial

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure and Install ESP32 Core 2.0.17
        env:
          ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: ""
        run: |
          rm -rf ~/.arduino15
          PROTO="https"
          HOST="raw.githubusercontent.com"
          REPO="espressif/arduino-esp32/gh-pages/package_esp32_index.json"
          ESP_URL="${PROTO}://${HOST}/${REPO}"
          echo "Using URL: $ESP_URL"
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls "$ESP_URL"
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls "$ESP_URL"


      - name: Install Required Libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "LiquidCrystal"
          arduino-cli lib install "AsyncTCP"
          arduino-cli lib install "ESP Async WebServer"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "OneWire"
          arduino-cli lib install "DallasTemperature"
          arduino-cli lib install "GyverButton"
          arduino-cli lib install "GyverEncoder"
          H_PATH=$(find . -name "LiquidCrystal_I2C.h" | head -n 1)
          echo "Found header at: $H_PATH"
          cat << 'EOF' > yoRadio/LiquidCrystal_I2C.cpp
          #include <inttypes.h>
          #include <Arduino.h>
          #include <Wire.h>
          EOF
          echo "#include \"../$H_PATH\"" >> yoRadio/LiquidCrystal_I2C.cpp
          cat << 'EOF' >> yoRadio/LiquidCrystal_I2C.cpp

          LiquidCrystal_I2C::LiquidCrystal_I2C(uint8_t lcd_addr, uint8_t lcd_cols, uint8_t lcd_rows, uint8_t sda, uint8_t scl) {
            _addr = lcd_addr;
            _cols = lcd_cols;
            _rows = lcd_rows;
            _sda = sda;
            _scl = scl;
            _backlightval = LCD_BACKLIGHT;
          }

          void LiquidCrystal_I2C::init() {
            Wire.begin(_sda, _scl);
            _displayfunction = LCD_4BITMODE | LCD_1LINE | LCD_5x8DOTS;
            if (_rows > 1) {
              _displayfunction |= LCD_2LINE;
            }
            delay(50);
            expanderWrite(_backlightval);
            delay(1000);
            write4bits(0x03 << 4);
            delayMicroseconds(4500);
            write4bits(0x03 << 4);
            delayMicroseconds(4500);
            write4bits(0x03 << 4);
            delayMicroseconds(150);
            write4bits(0x02 << 4);
            command(LCD_FUNCTIONSET | _displayfunction);
            _displaycontrol = LCD_DISPLAYON | LCD_CURSOROFF | LCD_BLINKOFF;
            display();
            clear();
            _displaymode = LCD_ENTRYLEFT | LCD_ENTRYSHIFTDECREMENT;
            command(LCD_ENTRYMODESET | _displaymode);
            home();
          }

          void LiquidCrystal_I2C::begin(uint8_t cols, uint8_t lines, uint8_t dotsize) {
            init();
          }

          void LiquidCrystal_I2C::clear() {
            command(LCD_CLEARDISPLAY);
            delayMicroseconds(2000);
          }

          void LiquidCrystal_I2C::home() {
            command(LCD_RETURNHOME);
            delayMicroseconds(2000);
          }

          void LiquidCrystal_I2C::setCursor(uint8_t col, uint8_t row) {
            int row_offsets[] = { 0x00, 0x40, 0x14, 0x54 };
            if (row > _rows) row = _rows - 1;
            command(LCD_SETDDRAMADDR | (col + row_offsets[row]));
          }

          void LiquidCrystal_I2C::noDisplay() {
            _displaycontrol &= ~LCD_DISPLAYON;
            command(LCD_DISPLAYCONTROL | _displaycontrol);
          }

          void LiquidCrystal_I2C::display() {
            _displaycontrol |= LCD_DISPLAYON;
            command(LCD_DISPLAYCONTROL | _displaycontrol);
          }

          void LiquidCrystal_I2C::noCursor() {
            _displaycontrol &= ~LCD_CURSORON;
            command(LCD_DISPLAYCONTROL | _displaycontrol);
          }

          void LiquidCrystal_I2C::cursor() {
            _displaycontrol |= LCD_CURSORON;
            command(LCD_DISPLAYCONTROL | _displaycontrol);
          }

          void LiquidCrystal_I2C::noBlink() {
            _displaycontrol &= ~LCD_BLINKON;
            command(LCD_DISPLAYCONTROL | _displaycontrol);
          }

          void LiquidCrystal_I2C::blink() {
            _displaycontrol |= LCD_BLINKON;
            command(LCD_DISPLAYCONTROL | _displaycontrol);
          }

          void LiquidCrystal_I2C::scrollDisplayLeft(void) {
            command(LCD_CURSORSHIFT | LCD_DISPLAYMOVE | LCD_MOVELEFT);
          }

          void LiquidCrystal_I2C::scrollDisplayRight(void) {
            command(LCD_CURSORSHIFT | LCD_DISPLAYMOVE | LCD_MOVERIGHT);
          }

          void LiquidCrystal_I2C::leftToRight(void) {
            _displaymode |= LCD_ENTRYLEFT;
            command(LCD_ENTRYMODESET | _displaymode);
          }

          void LiquidCrystal_I2C::rightToLeft(void) {
            _displaymode &= ~LCD_ENTRYLEFT;
            command(LCD_ENTRYMODESET | _displaymode);
          }

          void LiquidCrystal_I2C::autoscroll(void) {
            _displaymode |= LCD_ENTRYSHIFTINCREMENT;
            command(LCD_ENTRYMODESET | _displaymode);
          }

          void LiquidCrystal_I2C::noAutoscroll(void) {
            _displaymode &= ~LCD_ENTRYSHIFTINCREMENT;
            command(LCD_ENTRYMODESET | _displaymode);
          }

          void LiquidCrystal_I2C::createChar(uint8_t location, uint8_t charmap[]) {
            location &= 0x7;
            command(LCD_SETCGRAMADDR | (location << 3));
            for (int i = 0; i < 8; i++) {
              write(charmap[i]);
            }
          }

          void LiquidCrystal_I2C::noBacklight(void) {
            _backlightva



      - name: Copy custom font (if exists)
        run: |
          if [ -f "yoRadio/fonts/glcdfont.c" ]; then
            cp -f yoRadio/fonts/glcdfont.c ~/Arduino/libraries/Adafruit_GFX_Library/glcdfont.c
          elif [ -f "fonts/glcdfont.c" ]; then
            cp -f fonts/glcdfont.c ~/Arduino/libraries/Adafruit_GFX_Library/glcdfont.c
          fi

      - name: Compile yoRadio Sketch
        run: |
          SKETCH_DIR="yoRadio"
          [ ! -d "$SKETCH_DIR" ] && SKETCH_DIR="."
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --build-path ./build_out \
            "$SKETCH_DIR"

      - name: Merge Binaries into Single File (0x0)
        run: |
          python -m esptool --chip esp32 merge_bin \
            -o yoRadio_merged.bin \
            --flash_mode dio \
            --flash_freq 40m \
            --flash_size 4MB \
            0x1000 ./build_out/*.ino.bootloader.bin \
            0x8000 ./build_out/*.ino.partitions.bin \
            0xe000 ~/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin \
            0x10000 ./build_out/*.ino.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yoRadio-ESP32-Firmware
          path: |
            yoRadio_merged.bin
            ./build_out/*.ino.bin
            
