name: Build yoRadio ESP32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core & Libraries
        run: |
          URL=$(echo "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL2VzcHJlc3NpZi9hcmR1aW5vLWVzcDMyL2doLXBhZ2VzL3BhY2thZ2VfZXNwMzJfaW5kZXguanNvbg==" | base64 -d)
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$URL"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "OneButton" "Adafruit GFX Library" "IRremoteESP8266" "RTClib" "XPT2046_Touchscreen"

      - name: Compile yoRadio
        run: |
          mkdir -p build_out
          arduino-cli compile --fqbn esp32:esp32:esp32 --build-property build.partitions=min_spiffs --build-property upload.maximum_size=1966080 --output-dir build_out yoRadio

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoRadio-firmware
          path: build_out/*.bin
          
